# Production stack for the VPS. See deploy/README.md.
# Docker writes its own iptables rules and bypasses ufw, so only Caddy publishes
# public ports (80/443). The web port is bound to 127.0.0.1 for debugging only.
name: sku-fashion

x-app: &app
  build: .
  image: sku-fashion-web
  restart: unless-stopped
  env_file: .env
  environment:
    DB_HOST: db
    DB_PORT: "5432"
    DJANGO_PRODUCTION: "1"
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  web:
    <<: *app
    command: sh -c "python manage.py migrate --noinput && exec gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 60 --access-logfile -"
    ports:
      - "127.0.0.1:8034:8000"
    volumes:
      - ./media:/app/media

  # FR-X09: cancel unpaid bank-transfer orders, once an hour.
  scheduler:
    <<: *app
    command: sh -c "while true; do python manage.py cancel_unpaid_orders; sleep 3600; done"
    volumes:
      - ./media:/app/media

  # HTTPS, /media/ from disk, everything else to `web`.
  caddy:
    image: caddy:2.11
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?set SITE_DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./media:/srv/media:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  pgdata:
  caddy_data:
  caddy_config:
