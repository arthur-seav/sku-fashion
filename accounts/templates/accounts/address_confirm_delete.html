{% extends "base.html" %}
{% block content %}
<div class="card mx-auto" style="max-width: 32rem">
  <div class="card-body">
    <h1 class="h5">Delete this address?</h1>
    <p class="text-muted">{{ object }}</p>
    <form method="post">
      {% csrf_token %}
      <button class="btn btn-danger" type="submit">Delete</button>
      <a class="btn btn-outline-secondary" href="{% url 'accounts:address_list' %}">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
