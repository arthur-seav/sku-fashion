{% extends "base.html" %}
{% block title %}Change password · {{ STORE_NAME }}{% endblock %}
{% block content %}
<div class="row g-4">
  <div class="col-3">{% include "accounts/partials/account_menu.html" with active="password" %}</div>
  <div class="col-6">
    <div class="card">
      <div class="card-header">Change password</div>
      <div class="card-body">
        <form method="post" novalidate>
          {% csrf_token %}
          {% include "partials/form_fields.html" with form=form %}
          <button class="btn btn-primary" type="submit">Change password</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
